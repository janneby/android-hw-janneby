plugins {
    // THE PLUGINS OR VERSIONS COULD BE DIFFERENT FROM THE ONES SHOWN IN THE VIDEOS.
    // DO NOT CHANGE OR UPDATE THE PLUGINS OR VERSION, UNLESS SPECIFIED BY THE INSTRUCTOR
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // Also add ksp plugin in project-level build.gradle file
    id 'com.google.devtools.ksp'
}

android {
    namespace 'se.linerotech.module204.guide'
    compileSdk 34

    defaultConfig {
        applicationId "se.linerotech.module204.guide"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true
    }
}

dependencies {
    // THE DEPENDENCIES OR VERSIONS COULD BE DIFFERENT FROM THE ONES SHOWN IN THE VIDEOS.
    // DO NOT CHANGE OR UPDATE THE DEPENDENCIES OR VERSION, UNLESS SPECIFIED BY THE INSTRUCTOR

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // activity
    implementation "androidx.activity:activity-ktx:1.7.2"

    // Preference DataStore
    implementation "androidx.datastore:datastore-preferences:1.0.0"

    // Splash Screen
    implementation "androidx.core:core-splashscreen:1.0.1"

    // Recycler View
    implementation "androidx.recyclerview:recyclerview:1.3.1"

    // Room Database
    def room_version = "2.5.2"

    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // To use ksp, add dependency in plugin section. See top of this file
    ksp "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
}