plugins {
    // THE PLUGINS OR VERSIONS COULD BE DIFFERENT FROM THE ONES SHOWN IN THE VIDEOS.
    // DO NOT CHANGE OR UPDATE THE PLUGINS OR VERSION, UNLESS SPECIFIED BY THE INSTRUCTOR
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    // Also add ksp plugin in project-level build.gradle file
    id 'com.google.devtools.ksp'
}

android {
    namespace 'se.linerotech.module202.guide'
    compileSdk 34

    defaultConfig {
        applicationId "se.linerotech.module202.guide"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true
    }
}

dependencies {
    // THE DEPENDENCIES OR VERSIONS COULD BE DIFFERENT FROM THE ONES SHOWN IN THE VIDEOS.
    // DO NOT CHANGE OR UPDATE THE DEPENDENCIES OR VERSION, UNLESS SPECIFIED BY THE INSTRUCTOR

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // activity
    implementation "androidx.activity:activity-ktx:1.7.1"

    // Retrofit
    implementation "com.squareup.moshi:moshi:1.14.0"
    // To use ksp, add dependency in plugin section. See top of this file
    ksp "com.squareup.moshi:moshi-kotlin-codegen:1.14.0"
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-moshi:2.9.0"

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.15.1'
}